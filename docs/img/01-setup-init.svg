<svg xmlns="http://www.w3.org/2000/svg" width="847" height="703" viewBox="0 0 847 703" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
<rect width="847" height="703" rx="10" fill="#1e1f29"/>
<rect width="847" height="32" rx="10" fill="#2b2c3b"/>
<circle cx="18" cy="16" r="6" fill="#ff5f56"/><circle cx="38" cy="16" r="6" fill="#ffbd2e"/><circle cx="58" cy="16" r="6" fill="#27c93f"/>
<text x="424" y="21" text-anchor="middle" fill="#c8c8d0" font-size="12">keelage setup → init → constraint (실제 출력)</text>
<text x="18" y="58" fill="#8be9fd" xml:space="preserve">$ keelage setup --yes</text>
<text x="18" y="77" fill="#f8f8f2" xml:space="preserve">hooks    installed (backup: )</text>
<text x="18" y="96" fill="#f8f8f2" xml:space="preserve">mcp      registered via claude CLI</text>
<text x="18" y="115" fill="#f8f8f2" xml:space="preserve">rules    no ~/.claude/CLAUDE.md</text>
<text x="18" y="134" fill="#f8f8f2" xml:space="preserve">daemon   start with `keelage daemon` (autostart is manual in v0: a systemd user unit or launchd agent</text>
<text x="18" y="153" fill="#f8f8f2" xml:space="preserve">    running `keelage daemon`)</text>
<text x="18" y="172" fill="#f8f8f2" xml:space="preserve">observe mode is on for every repository; run `keelage init` in a repository to activate it</text>
<text x="18" y="191" fill="#f8f8f2" xml:space="preserve"></text>
<text x="18" y="210" fill="#8be9fd" xml:space="preserve">$ keelage init --verify --yes</text>
<text x="18" y="229" fill="#f8f8f2" xml:space="preserve">absorb  imported  rule CLAUDE.md → 01M271NYH16AWG1V24E5GGPACY</text>
<text x="18" y="248" fill="#f8f8f2" xml:space="preserve">render  written   .keelage/context/claude-code/context.md</text>
<text x="18" y="267" fill="#f8f8f2" xml:space="preserve">render  written   CLAUDE.md</text>
<text x="18" y="286" fill="#f8f8f2" xml:space="preserve">gitignore .keelage/context/ added</text>
<text x="18" y="305" fill="#f8f8f2" xml:space="preserve">sidecar .keelage/manifest.json written</text>
<text x="18" y="324" fill="#f8f8f2" xml:space="preserve"></text>
<text x="18" y="343" fill="#8be9fd" xml:space="preserve">$ keelage constraint add --scope path=src/** --anchor code://src/calc.ts#fee --verify no retries in</text>
<text x="18" y="362" fill="#f8f8f2" xml:space="preserve">    billing</text>
<text x="18" y="381" fill="#f8f8f2" xml:space="preserve">01M271NYJ88B1ECNMHM03P3DJT</text>
<text x="18" y="400" fill="#f8f8f2" xml:space="preserve"></text>
<text x="18" y="419" fill="#8be9fd" xml:space="preserve">$ keelage constraint add --kind autonomy --level L0 --deny-edit --scope path=src/vault/* --verify vault</text>
<text x="18" y="438" fill="#f8f8f2" xml:space="preserve">    code is edited by humans</text>
<text x="18" y="457" fill="#f8f8f2" xml:space="preserve">01M271NYKJNWBXYJFJE6ZX2MA8</text>
<text x="18" y="476" fill="#f8f8f2" xml:space="preserve"></text>
<text x="18" y="495" fill="#8be9fd" xml:space="preserve">$ keelage anchor add code://src/calc.ts#fee</text>
<text x="18" y="514" fill="#f8f8f2" xml:space="preserve">code://src/calc.ts#fee  typescript  sig=705fd0e05172 body=751019a01147 file=61de9df06209</text>
<text x="18" y="533" fill="#f8f8f2" xml:space="preserve"></text>
<text x="18" y="552" fill="#8be9fd" xml:space="preserve">$ keelage status</text>
<text x="18" y="571" fill="#f8f8f2" xml:space="preserve">daemon   not running (~/.keelage/keelage.sock) — hooks fail open</text>
<text x="18" y="590" fill="#f8f8f2" xml:space="preserve">hooks    installed in ~/.claude/settings.json</text>
<text x="18" y="609" fill="#f8f8f2" xml:space="preserve">mcp      not registered — claude mcp add --transport stdio --scope user keelage -- keelage mcp</text>
<text x="18" y="628" fill="#f8f8f2" xml:space="preserve">repo     . — active (1 import(s), 2 rendered, adapters map[claude-code:0.1.0])</text>
<text x="18" y="647" fill="#f8f8f2" xml:space="preserve">  ok        .keelage/context/claude-code/context.md</text>
<text x="18" y="666" fill="#f8f8f2" xml:space="preserve">  ok        CLAUDE.md</text>
